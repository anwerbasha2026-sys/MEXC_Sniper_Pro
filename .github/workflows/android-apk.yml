name: Build MEXC Sniper Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'buildozer.spec'
      - 'requirements.txt'
      - 'main.py'
      - 'service.py'
      - 'app/**'
      - 'android/**'
      - 'generated/**'
      - 'proto/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical Android entry point
        shell: bash
        run: |
          set -euo pipefail
          test -f main.py
          ! grep -q "android\.mobile_main" main.py
          grep -q "BootstrapApp" main.py
          test -f service.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf automake autopoint libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev gettext
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.6.0" "cython==0.29.37"

      - name: Clean
        run: |
          rm -rf .buildozer bin
          mkdir -p bin

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer-build.log

      - name: Verify generated application source
        shell: bash
        run: |
          set -euo pipefail
          test -f .buildozer/android/app/main.py
          ! grep -q "android\.mobile_main" .buildozer/android/app/main.py
          grep -q "BootstrapApp" .buildozer/android/app/main.py

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -type f -iname '*.apk' -not -path './.git/*' -not -path './.buildozer/android/platform/python-for-android/*' | head -n 1 || true)"
          test -n "$APK"
          cp "$APK" bin/mexc-sniper-onn-gn3-armeabi-v7a-debug.apk
          test -s bin/mexc-sniper-onn-gn3-armeabi-v7a-debug.apk
          ls -lh bin/mexc-sniper-onn-gn3-armeabi-v7a-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mexc-sniper-onn-gn3-v3
          path: bin/mexc-sniper-onn-gn3-armeabi-v7a-debug.apk
          if-no-files-found: error

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics-v3
          path: |
            buildozer-build.log
            .buildozer/**/*.log
            .buildozer/**/build.log
          if-no-files-found: warn
